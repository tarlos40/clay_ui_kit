name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Debug repository structure
        run: |
         echo "Diretório atual:"
         pwd
         echo "Arquivos da raiz:"
         ls -la
         echo "Arquivos e diretórios:"
         find . -maxdepth 3 -type f \
         \( -name "pubspec.yaml" -o -name "index.html" \)

      - name: Build Flutter Web and prepare Vercel output
        run: bash scripts/build_web.sh

      - name: Verify deployment output
        run: |
          echo "Arquivos gerados:"
          find .vercel/output -maxdepth 3 -type f | sort
          test -f .vercel/output/config.json
          test -f .vercel/output/static/index.html

      - name: Verify Vercel routes
        run: |
          cat .vercel/output/config.json
          test -f .vercel/output/static/index.html

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
